version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: qmai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-qmai_root_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qmai}
      MYSQL_USER: ${MYSQL_USER:-qmai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-qmai_123}
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-qmai_root_2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - qmai-network

  redis:
    image: redis:7-alpine
    container_name: qmai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-qmai_redis}
    volumes:
      - ./redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-qmai_redis}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - qmai-network

  minio:
    image: minio/minio
    container_name: qmai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-qmai_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-qmai_minio_2024}
    volumes:
      - ./minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qmai-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: qmai-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-qmai}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-qmai_rabbit}
    volumes:
      - ./rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - qmai-network

networks:
  qmai-network:
    driver: bridge
